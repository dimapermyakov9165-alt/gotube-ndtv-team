<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idiathub 3.0</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('font.ttf') format('truetype');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'CustomFont', sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #authScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:#121212; z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .auth-box h2 { text-align: center; color: #00ffcc; margin-bottom: 5px; }
        
        header { display: none; background: #1a1a1a; padding: 10px 15px; border-bottom: 1px solid #333; align-items: center; justify-content: space-between; font-size: 14px; height: 50px; flex-shrink: 0; }
        .user-badge { display: flex; align-items: center; gap: 8px; }
        .online-dot { width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ffcc; }

        .content-container { flex: 1; overflow: hidden; position: relative; }
        .content-page { display: none; position: absolute; top:0; left:0; width:100%; height:100%; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        .content-page.active { display: flex; flex-direction: column; }

        .video-card { background: #1e1e1e; margin-bottom: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        video, iframe { width: 100%; aspect-ratio: 16/9; background: #000; border: none; display: block; }
        .img-preview { width: 100%; max-height: 350px; object-fit: contain; background: #151515; display: block; }
        
        .v-info { padding: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .v-info-left { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .v-title { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
        .v-author { font-size: 12px; color: #aaa; cursor: pointer; }
        .v-author:hover { color: #00ffcc; text-decoration: underline; }

        .subscribe-btn { background: #fff; color: #121212; border: none; padding: 6px 14px; border-radius: 16px; font-weight: bold; font-size: 12px; cursor: pointer; transition: background 0.2s, color 0.2s; flex-shrink: 0; }
        .subscribe-btn.subscribed { background: #333; color: #aaa; }

        .v-actions { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #252525; font-size: 13px; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .action-btn.liked { color: #00ffcc; }
        .delete-btn { color: #ff3333; background: none; border: none; cursor: pointer; font-size: 12px; }

        .comments-section { padding: 12px; background: #161616; display: flex; flex-direction: column; gap: 6px; }
        .comments-list { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
        .comment-item { background: #222; padding: 5px 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .comment-input-block { display: flex; gap: 5px; margin-top: 4px; }

        .profile-card { background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 15px; }
        .color-picker-group { display: flex; gap: 10px; align-items: center; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; border-top: 1px solid #333; height: 60px; z-index: 99; }
        .tab-btn { flex: 1; border: none; background: none; color: #888; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .tab-btn.active { color: #00ffcc; background: #222; }

        .tiktok-plus-btn {
            background: linear-gradient(135deg, #00ffcc, #ff0055);
            border: none;
            width: 42px;
            height: 32px;
            border-radius: 8px;
            color: #121212;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,255,204,0.4);
            transition: transform 0.1s;
        }
        .tiktok-plus-btn:active { transform: scale(0.92); }

        input, select { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 14px; }
        .btn { padding: 10px 15px; border: none; background: #00ffcc; color: #121212; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .secondary-btn { background: none; color: #aaa; font-size: 12px; border: none; cursor: pointer; text-decoration: underline; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #202020; padding: 20px; border-radius: 8px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; }
        
        .channel-item { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #00ffcc; display: flex; justify-content: space-between; align-items: center; }

        .channel-header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        .channel-header-info { display: flex; flex-direction: column; gap: 3px; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box" id="loginForm">
            <h2>Вход в Idiathub</h2>
            <input type="text" id="loginUser" placeholder="Логин (Имя)">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn" id="btnLoginAction">Войти</button>
            <button class="secondary-btn" id="btnGoToReg">Регистрация нового аккаунта</button>
        </div>
        
        <div class="auth-box" id="regForm" style="display: none;">
            <h2>Создать вечный аккаунт</h2>
            <input type="text" id="regUser" placeholder="Придумайте Логин">
            <input type="password" id="regPass" placeholder="Придумайте Пароль">
            <button class="btn" id="btnRegAction">Зарегистрироваться</button>
            <button class="secondary-btn" id="btnGoToLogin">Назад ко входу</button>
        </div>
    </div>

    <header id="mainHeader">
        <div class="user-badge"><span class="online-dot"></span> <b id="headerUsername">Гость</b></div>
        <div id="onlineCount" style="color:#aaa; font-size:12px;">В сети: --</div>
    </header>

    <div class="content-container">
        <section id="feedPage" class="content-page">
            <div id="globalFeedGrid"></div>
        </section>

        <section id="channelsPage" class="content-page">
            <div id="channelsContainerList"></div>
        </section>

        <section id="subscriptionsPage" class="content-page">
            <h3 style="margin-bottom: 15px; color: #00ffcc;">Мои подписки</h3>
            <div id="subscriptionsContainerList"></div>
        </section>

        <section id="singleChannelPage" class="content-page">
            <button class="secondary-btn" id="btnBackToChannels" style="align-self:flex-start; margin-bottom:15px;">← Назад к каналам</button>
            <div class="channel-header-box">
                <div class="channel-header-info">
                    <h2 id="channelViewTitle" style="color:#00ffcc; margin-bottom:2px;">Канал</h2>
                    <p id="channelViewStatus" style="color:#aaa; font-size:13px; font-style:italic;"></p>
                    <p id="channelSubscribersCount" style="color:#fff; font-size:12px; margin-top:4px;">Подписчиков: 0</p>
                </div>
                <button id="channelSubscribeBtn" class="subscribe-btn" style="display: none;">Подписаться</button>
            </div>
            <div id="channelFeedGrid"></div>
        </section>

        <section id="profilePage" class="content-page">
            <div class="profile-card">
                <h3>Твой профиль</h3>
                <label>Статус:</label>
                <input type="text" id="statusInput" placeholder="Что делаешь?">
                <div class="color-picker-group">
                    <label>Цвет никнейма:</label>
                    <input type="color" id="colorInput" value="#ff3333">
                </div>
                <button class="btn" id="btnSaveProfile">Сохранить</button>
                <button class="btn" id="btnLogoutAction" style="background:#ff3333; color:white; margin-top:20px;">Выйти из системы</button>
                <button class="btn" id="btnDeleteAccountAction" style="background:#8b0000; color:white; margin-top:8px;">Удалить аккаунт</button>
            </div>
        </section>
    </div>

    <nav class="bottom-nav" id="mainNav">
        <button class="tab-btn active" id="tabBtnFeed">Лента</button>
        <button class="tab-btn" id="tabBtnChannels">Каналы</button>
        <button class="tab-btn" id="tabBtnPlus" style="display:flex; justify-content:center; align-items:center;">
            <div class="tiktok-plus-btn">+</div>
        </button>
        <button class="tab-btn" id="tabBtnSubs">Подписки</button>
        <button class="tab-btn" id="tabBtnProfile">Профиль</button>
    </nav>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTargetTitle">Новый пост</h3>
            <input type="text" id="vTitle" placeholder="Описание поста">
            <input type="text" id="vUrl" placeholder="Вставьте ссылку на YouTube или видео/фото">
            <div style="text-align: center; color: #666; font-size: 11px;">— ИЛИ (файл или фото до 1 ГБ) —</div>
            <div style="border: 1px dashed #444; padding: 10px; border-radius: 6px; background: #1a1a1a;">
                <input type="file" id="vFile" accept="image/*,video/*" style="width:100%; background:none; border:none; padding:0;">
            </div>
            <div id="uploadStatus" style="text-align:center; color:#00ffcc; font-size:13px;"></div>
            <button class="btn" id="publishBtn">Выложить</button>
            <button class="btn" id="btnCloseUploadModal" style="background:#383838; color:white;">Отмена</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, get, remove, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ТВОЙ НОВЫЙ КОНФИГ
        const firebaseConfig = {
            apiKey: "AIzaSyCPhGwtKzvxj1TfQpJm3CkEWreicc0_vcA",
            authDomain: "gotube-c1757.firebaseapp.com",
            databaseURL: "https://gotube-c1757-default-rtdb.firebaseio.com",
            projectId: "gotube-c1757",
            storageBucket: "gotube-c1757.firebasestorage.app",
            messagingSenderId: "596030803988",
            appId: "1:596030803988:web:bb75cb1668467c8694d701",
            measurementId: "G-MG01EH97H8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ... (остальной функционал остается тем же)
        let currentUser = localStorage.getItem('idiathub_user') || null;
        let currentUploadScope = 'global';
        let viewedChannelName = null;

        const isAdmin = () => currentUser === 'dontcry';

        function getRoleBadge(username) {
            if (username === 'dontcry') return ' <span style="color: #ff3333; font-size: 11px; font-weight: bold;">[создатель]</span>';
            return '';
        }

        document.getElementById('btnGoToReg').addEventListener('click', () => toggleAuthForms(true));
        document.getElementById('btnGoToLogin').addEventListener('click', () => toggleAuthForms(false));
        document.getElementById('btnRegAction').addEventListener('click', () => authRegister());
        document.getElementById('btnLoginAction').addEventListener('click', () => authLogin());
        document.getElementById('btnLogoutAction').addEventListener('click', () => logOut());
        document.getElementById('btnDeleteAccountAction').addEventListener('click', () => deleteAccount());
        document.getElementById('btnSaveProfile').addEventListener('click', () => saveProfile());
        
        document.getElementById('tabBtnFeed').addEventListener('click', () => switchTab('feed'));
        document.getElementById('tabBtnChannels').addEventListener('click', () => switchTab('channels'));
        document.getElementById('tabBtnSubs').addEventListener('click', () => switchTab('subscriptions'));
        document.getElementById('tabBtnProfile').addEventListener('click', () => switchTab('profile'));
        document.getElementById('btnBackToChannels').addEventListener('click', () => switchTab('channels'));

        document.getElementById('tabBtnPlus').addEventListener('click', () => {
            const activePage = document.querySelector('.content-page.active');
            if (activePage && activePage.id === 'singleChannelPage' && viewedChannelName === currentUser) {
                toggleModal('uploadModal', 'channel');
            } else {
                toggleModal('uploadModal', 'global');
            }
        });

        document.getElementById('btnCloseUploadModal').addEventListener('click', () => toggleModal('uploadModal'));
        document.getElementById('publishBtn').addEventListener('click', () => addPost());

        if (currentUser) { checkUserExistence(currentUser); } else { document.getElementById('authScreen').style.display = 'flex'; }

        async function checkUserExistence(username) {
            try {
                const userRef = ref(db, 'users/' + username);
                const snapshot = await get(userRef);
                if (snapshot.exists()) { enterApp(); } else { localStorage.removeItem('idiathub_user'); currentUser = null; document.getElementById('authScreen').style.display = 'flex'; }
            } catch (e) { localStorage.removeItem('idiathub_user'); currentUser = null; document.getElementById('authScreen').style.display = 'flex'; }
        }

        function enterApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('mainNav').style.display = 'flex';
            document.getElementById('headerUsername').innerHTML = currentUser + getRoleBadge(currentUser);
            setupPresence();
            setupProfileData();
            switchTab('feed');
            loadGlobalFeed();
            loadChannelsList();
        }

        function toggleAuthForms(showReg) {
            document.getElementById('loginForm').style.display = showReg ? 'none' : 'flex';
            document.getElementById('regForm').style.display = showReg ? 'flex' : 'none';
        }

        async function authRegister() {
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!user || !pass) return alert('Заполните все поля!');
            try {
                const snapshot = await get(ref(db, 'users/' + user));
                if(snapshot.exists()) return alert('Этот логин занят!');
                await set(ref(db, 'users/' + user), { password: pass, status: "Всем привет!" });
                currentUser = user;
                localStorage.setItem('idiathub_user', currentUser);
                enterApp();
            } catch(e) { alert("Ошибка: " + e.message); }
        }

        async function authLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            try {
                const snapshot = await get(ref(db, 'users/' + user));
                if(snapshot.exists() && snapshot.val().password === pass) {
                    currentUser = user;
                    localStorage.setItem('idiathub_user', currentUser);
                    enterApp();
                } else { alert('Неверный логин или пароль!'); }
            } catch(e) { alert("Ошибка: " + e.message); }
        }

        function logOut() { localStorage.removeItem('idiathub_user'); location.reload(); }
        
        async function deleteAccount() {
            if(!confirm('Точно удалить свой аккаунт?')) return;
            await remove(ref(db, 'users/' + currentUser));
            await remove(ref(db, `channels/${currentUser}`));
            localStorage.removeItem('idiathub_user');
            location.reload();
        }

        function setupPresence() {
            const onlineRef = ref(db, 'online/' + currentUser);
            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => { if (snap.val() === true) { set(onlineRef, true); onDisconnect(onlineRef).remove(); } });
            onValue(ref(db, 'online'), (snap) => { document.getElementById('onlineCount').innerText = `В сети: ${snap.exists() ? Object.keys(snap.val()).length : 0}`; });
        }

        async function setupProfileData() {
            const snap = await get(ref(db, 'users/' + currentUser));
            if(snap.exists()) { document.getElementById('statusInput').value = snap.val().status || ''; }
        }

        async function saveProfile() {
            const status = document.getElementById('statusInput').value.trim();
            await update(ref(db, `users/${currentUser}`), { status: status });
            alert('Сохранено!');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => { if (btn.id !== 'tabBtnPlus') btn.classList.remove('active'); });
            document.querySelectorAll('.content-page').forEach(page => page.classList.remove('active'));
            const btnMap = { 'feed': 'tabBtnFeed', 'channels': 'tabBtnChannels', 'subscriptions': 'tabBtnSubs', 'profile': 'tabBtnProfile' };
            if(btnMap[tabName]) document.getElementById(btnMap[tabName]).classList.add('active');
            document.getElementById(`${tabName}Page`).classList.add('active');
            if (tabName === 'subscriptions') loadSubscriptionsList();
        }

        async function toggleSubscription(authorName, buttonElement) {
            const subRef = ref(db, `subscriptions/${currentUser}/${authorName}`);
            const channelSubRef = ref(db, `subscribers/${authorName}/${currentUser}`);
            const snap = await get(subRef);
            if (snap.exists()) {
                await remove(subRef); await remove(channelSubRef);
                buttonElement.innerText = 'Подписаться'; buttonElement.classList.remove('subscribed');
            } else {
                await set(subRef, true); await set(channelSubRef, true);
                buttonElement.innerText = 'Вы подписаны'; buttonElement.classList.add('subscribed');
            }
            if (viewedChannelName === authorName) updateChannelSubscribersCount(authorName);
        }

        async function updateChannelSubscribersCount(channelName) {
            const snap = await get(ref(db, `subscribers/${channelName}`));
            const count = snap.exists() ? Object.keys(snap.val()).length : 0;
            const counterEl = document.getElementById('channelSubscribersCount');
            if (counterEl) counterEl.innerText = `Подписчиков: ${count}`;
        }

        function createPostElement(id, post, databasePath) {
            let playerHtml = post.mediaType === 'image' ? `<img src="${post.url}" class="img-preview">` : 
                             post.mediaType === 'youtube' ? `<iframe src="https://www.youtube.com/embed/${post.url.split('/').pop().split('v=')[1]?.split('&')[0] || post.url.split('/').pop()}"></iframe>` : 
                             `<video src="${post.url}" controls></video>`;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `${playerHtml}<div class="v-info"><div><div class="v-title">${post.title}</div><div class="v-author">От: <b>${post.author}</b></div></div></div><div class="v-actions"><button class="action-btn">❤️</button><button class="delete-btn" data-del-path="${databasePath}/${id}">🗑️</button></div>`;
            
            if(post.author !== currentUser && !isAdmin()) card.querySelector('.delete-btn').style.display = 'none';
            card.querySelector('.delete-btn').addEventListener('click', (e) => { if(confirm('Удалить?')) remove(ref(db, e.currentTarget.dataset.delPath)); });
            
            return card;
        }

        function loadGlobalFeed() {
            onValue(ref(db, 'global_feed'), (snap) => {
                const grid = document.getElementById('globalFeedGrid');
                grid.innerHTML = '';
                if(snap.exists()) Object.keys(snap.val()).reverse().forEach(id => grid.appendChild(createPostElement(id, snap.val()[id], 'global_feed')));
            });
        }

        function loadChannelsList() {
            onValue(ref(db, 'users'), (snap) => {
                const list = document.getElementById('channelsContainerList');
                list.innerHTML = '';
                if(snap.exists()) Object.keys(snap.val()).forEach(username => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<div><b>Канал: ${username}</b></div>`;
                    item.addEventListener('click', () => openChannel(username, snap.val()[username].status));
                    list.appendChild(item);
                });
            });
        }

        async function loadSubscriptionsList() {
            const list = document.getElementById('subscriptionsContainerList');
            const snap = await get(ref(db, `subscriptions/${currentUser}`));
            list.innerHTML = '';
            if(snap.exists()) Object.keys(snap.val()).forEach(async author => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `<div><b>Канал: ${author}</b></div>`;
                item.addEventListener('click', () => openChannel(author, ''));
                list.appendChild(item);
            });
        }

        function openChannel(username, status) {
            viewedChannelName = username;
            document.querySelectorAll('.content-page').forEach(p => p.classList.remove('active'));
            document.getElementById('singleChannelPage').classList.add('active');
            document.getElementById('channelViewTitle').innerText = `Канал: ${username}`;
            updateChannelSubscribersCount(username);
            onValue(ref(db, `channels/${username}`), (snap) => {
                const grid = document.getElementById('channelFeedGrid');
                grid.innerHTML = '';
                if(snap.exists()) Object.keys(snap.val()).reverse().forEach(id => grid.appendChild(createPostElement(id, snap.val()[id], `channels/${username}`)));
            });
        }

        async function addPost() {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            if (!title || !url) return alert('Заполните поля!');
            const postData = { title, url, mediaType: url.includes('youtu') ? 'youtube' : 'video', author: currentUser };
            if(currentUploadScope === 'global') await push(ref(db, 'global_feed'), postData);
            else await push(ref(db, `channels/${currentUser}`), postData);
            toggleModal('uploadModal');
        }

        function toggleModal(id, scope = 'global') {
            currentUploadScope = scope;
            const modal = document.getElementById(id);
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
    </script>
</body>
</html>
